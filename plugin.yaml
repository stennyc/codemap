name: code_map
version: 1.0.0
description: L1.5 code-symbol index (tree-sitter based, zero external API). Cross-file symbol lookup + single-file outline + authoritative re-scan.
author: Agnes
license: MIT
python_dependencies:
  - "tree-sitter>=0.21"
  - "tree-sitter-python"
  - "tree-sitter-typescript"
  - "tree-sitter-javascript"
  - "tree-sitter-go"
  - "tree-sitter-rust"
  - "tree-sitter-java"
  - "tree-sitter-dart"
  - "tree-sitter-c"
  - "tree-sitter-cpp"
  - "filelock>=3.12"
provides_tools:
  - code_map_query
  - code_map_confirm_root
  - code_map_refresh
  - code_map_check_root
provides_hooks:
  - transform_tool_result
  - post_tool_call
config_schema:
  override_tools:
    type: bool
    default: true
    label: "Allow tool override"
    description: "授权 code_map 覆盖宿主原生 read_file/search_files 结果（注入符号大纲 + 跨文件 import 边）。关闭后工具面退回宿主原生行为。"
