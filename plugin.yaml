name: code_map
version: 1.0.0
description: L1.5 code-symbol index (tree-sitter based, zero external API). Cross-file symbol lookup + single-file outline + authoritative re-scan.
author: Agnes
license: MIT
python_dependencies:
  - "tree-sitter>=0.21"
  - "tree-sitter-python"
  - "tree-sitter-typescript"
  - "tree-sitter-javascript"
  - "tree-sitter-go"
  - "tree-sitter-rust"
  - "tree-sitter-java"
  - "tree-sitter-dart"
  - "tree-sitter-c"
  - "tree-sitter-cpp"
  - "filelock>=3.12"
provides_tools:
  - code_map_query
  - code_map_confirm_root
  - code_map_refresh
  - code_map_check_root
provides_hooks:
  - transform_tool_result
  - post_tool_call
config_schema:
  granted_capabilities:
    type: list
    default: []
    label: "Granted capabilities"
    description: "宿主 capability 门禁：该插件被授权的能力列表（如 [\"tools.override\"]）。启用/能力由 hermes plugins 侧控制，非插件行为档位。"
schema: legacy_nested
